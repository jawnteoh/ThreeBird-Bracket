<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threebird Tournament</title>
<meta name="description" content="Threebird Amateur Soccer Tournament: 10-team round robin, league table and knockout bracket. Sat Nov 21, 5-11 PM, Louisville, KY.">
<meta name="theme-color" content="#D61F26">
<meta property="og:title" content="Threebird Amateur Soccer Tournament">
<meta property="og:description" content="Round robin fixtures, live league table and knockout bracket.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <div class="grain" aria-hidden="true"></div>
  <div class="wrap">
    <div class="crest"><svg viewBox="0 0 100 130" role="img" aria-label="Threebird crest"><polygon points="0,0 100,0 100,95 50,130 0,95" fill="#FEF6D5"/><image href="assets/logo.png" x="17" y="16" width="66" height="85.8" preserveAspectRatio="xMidYMid meet"/></svg></div>
    <div class="lockup"><h1 id="title">Threebird</h1><div class="sub" id="sub"><span id="sub-t">Amateur Soccer Tournament</span></div></div>
    <div class="meta"><span>Sat Nov 21</span><span>5-11 PM</span><span>Louisville, KY</span></div>
  </div>
</header>
<nav class="tabs" aria-label="Pages"><div class="wrap"><a href="#table" id="tab-table">Table</a><a href="#fixtures" id="tab-fixtures">Fixtures</a><a href="#settings" id="tab-settings">Settings</a><span id="sync-note" class="sync-note" role="status" hidden></span><button type="button" id="auth-btn" class="authbtn" aria-label="Organizer sign in" title="Organizer sign in" hidden><svg class="i-lock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><rect x="3" y="7" width="10" height="7"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg><svg class="i-unlock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true" hidden><rect x="3" y="7" width="10" height="7"/><path d="M5 7V5a3 3 0 0 1 5.8-1"/></svg></button></div>
  <form id="auth-form" class="authform" hidden><div class="wrap"><input type="email" id="auth-email" placeholder="Organizer email" autocomplete="username" required><input type="password" id="auth-pass" placeholder="Password" autocomplete="current-password" required><button type="submit">Sign in</button><span id="auth-err" class="auth-err" role="alert"></span></div></form></nav>

<main>
  <div class="wrap">
    <div class="page" id="page-table">
    <section aria-labelledby="t-h" id="sec-table" class="xsec">
      <div class="xfit" data-w="960">
      <div class="tbanner">
        <div class="mini" aria-hidden="true"></div>
        <h2 id="t-h">League table</h2>
        <button type="button" class="xbtn" data-sec="sec-table" aria-label="Expand" title="Expand"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
      </div>
      <div class="scroll tcard">
        <table>
          <thead>
            <tr><th>Pos</th><th class="team">Team</th><th title="Played">Pl</th><th title="Won">W</th><th title="Drawn">D</th><th title="Lost">L</th><th title="Goals for">GF</th><th title="Goals against">GA</th><th title="Goal difference">GD</th><th class="pts" title="Points">Pts</th></tr>
          </thead>
          <tbody id="table"></tbody>
        </table>
      </div>
      <div class="tstrip" aria-hidden="true"></div>
      </div>
    </section>

    <section aria-labelledby="k-h" id="sec-bracket" class="xsec">
      <div class="xfit" data-w="1000">
        <div class="tbanner">
          <div class="mini" aria-hidden="true"></div>
          <h2 id="k-h">Bracket</h2>
        </div>
        <div class="kbar"><span id="lock"></span><button type="button" class="xbtn" data-sec="sec-bracket" aria-label="Expand" title="Expand"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button></div>
        <div class="ko-card"><div class="ko-scroll"><div class="ko" id="ko"></div></div></div>
        <div class="champ" id="champ" hidden><div class="eyebrow">Champions</div><div class="display" id="champ-name"></div></div>
        <div class="tstrip" aria-hidden="true"></div>
      </div>
    </section>



    </div>

    <div class="page" id="page-fixtures" hidden>
    <section aria-labelledby="f-h">
      <div class="head">
        <h2 id="f-h">Fixtures</h2>
      </div>
      <div class="rounds" id="rounds"></div>
    </section>

    </div>
    <div class="page" id="page-settings" hidden>
    <section aria-labelledby="n-h">
      <div class="head">
        <h2 id="n-h">Teams</h2>
      </div>
      <div class="teams" id="teams"></div>
      <div class="actions">
        <button type="button" id="clear">Clear all scores</button>
      </div>
    </section>
    </div>
  </div>
</main>

<script>
(function () {
  var libs = [
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js",
    "https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js",
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"
  ];
  function add(src, next) {
    var s = document.createElement("script");
    s.src = src; s.async = false; s.onload = function () { next(true); }; s.onerror = function () { next(false); };
    document.head.appendChild(s);
  }
  function loadLib(i, done) {
    if (window.supabase && window.supabase.createClient) return done();
    if (i >= libs.length) return done();
    add(libs[i], function () { loadLib(i + 1, done); });
  }
  loadLib(0, function () { add("config.js", function () { add("app.js", function () {}); }); });
})();
</script>
</body>
</html>
